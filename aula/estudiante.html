const ref = () => db.collection('estudiantes').doc(token);

async function init(){
  if(!token){ return errorPage('This link is not valid. Please ask Prof. Felipe Florez for your personal link.'); }
  try { localStorage.setItem('ea_student_token', token); } catch(e){}

  // 1. Instant zero-latency pre-render from fallback seed or localStorage cache
  if (FALLBACK_STUDENTS[token]) {
    EST = Object.assign({}, FALLBACK_STUDENTS[token]);
  } else {
    const cached = localStorage.getItem('englishaurora_students_cache');
    if (cached) {
      try {
        const list = JSON.parse(cached);
        const found = list.find(s => s.id === token || s.student_token === token);
        if (found) EST = Object.assign({}, found);
      } catch(e){}
    }
  }

  if (EST) {
    try { render(); } catch(e){}
    if (FALLBACK_TAREAS[token]) renderTareasList(FALLBACK_TAREAS[token]);
    if (FALLBACK_HISTORIAL[token]) renderHistorialTable(FALLBACK_HISTORIAL[token]);
  }

  // 2. Fetch fresh updates from Firestore (with fast 2500ms timeout & REST fallback)
  const fbKey = 'AIzaSyB3-Zld9m5cskqIj1h3Dmf4qfy52rVtEqM';
  try {
    const timeoutPromise = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 2500));
    let snap = null;
    try {
      snap = await Promise.race([ref().get(), timeoutPromise]);
    } catch(sdkErr) {
      // Direct REST fallback if SDK hangs or quota limits
      try {
        const res = await fetch(`https://firestore.googleapis.com/v1/projects/sanguine-fusion-403621/databases/(default)/documents/estudiantes/${encodeURIComponent(token)}?key=${fbKey}`);
        if (res.ok) {
          const doc = await res.json();
          if (doc && doc.fields) {
            const f = doc.fields;
            const clasesArr = f.clases?.arrayValue?.values ? f.clases.arrayValue.values.map(v => v.stringValue) : [];
            const horasMap = {};
            if (f.clases_horas?.mapValue?.fields) {
              for (const [k, v] of Object.entries(f.clases_horas.mapValue.fields)) {
                horasMap[k] = Number(v.integerValue || v.stringValue || 1.0);
              }
            }
            const notasMap = {};
            if (f.clases_notas?.mapValue?.fields) {
              for (const [k, v] of Object.entries(f.clases_notas.mapValue.fields)) {
                notasMap[k] = v.stringValue || '';
              }
            }
            const liveData = {
              nombre: f.nombre?.stringValue || EST?.nombre,
              correo: f.correo?.stringValue || EST?.correo,
              nivel: f.nivel?.stringValue || EST?.nivel,
              horas_contratadas: Number(f.horas_contratadas?.integerValue || EST?.horas_contratadas || 40),
              horas_dadas: Number(f.horas_dadas?.integerValue || EST?.horas_dadas || 0),
              horas_restantes: Number(f.horas_restantes?.integerValue || EST?.horas_restantes || 0),
              clases: clasesArr,
              clases_horas: horasMap,
              clases_notas: notasMap
            };
            EST = Object.assign({}, EST || {}, liveData);
            const cont = document.getElementById('horasContenedor');
            if (cont) cont.innerHTML = renderHorasCardBody();
          }
        }
      } catch(restErr){}
    }

    if (snap && snap.exists) {
      EST = Object.assign({}, EST || {}, snap.data());
      const cont = document.getElementById('horasContenedor');
      if (cont) cont.innerHTML = renderHorasCardBody();
    }

    try { await cargarCatalogo(); } catch(e){}

    if (!document.getElementById('horasCard')) {
      if(!EST) return errorPage('We could not find your classroom. Please verify that you copied the complete link.');
      render();
    }

    cargarTareas();
    cargarHistorial();
    cargarComentarios();

    // Sincronización en tiempo real de horas y clases impartidas si la conexión está activa
    try {
      ref().onSnapshot(docSnap => {
        if (docSnap && docSnap.exists) {
          EST = Object.assign({}, EST, docSnap.data());
          const cont = document.getElementById('horasContenedor');
          if (cont) cont.innerHTML = renderHorasCardBody();
        }
      }, err => {
        console.warn('Realtime hours listener deferred:', err);
      });
    } catch(e){}
  } catch(e){
    console.error(e);
    if (!EST) {
      if (FALLBACK_STUDENTS[token]) {
        EST = Object.assign({}, FALLBACK_STUDENTS[token]);
        render();
        cargarTareas(); cargarHistorial(); cargarComentarios();
      } else {
        errorPage('Could not load classroom. Please check your internet connection and try again.');
      }
    }
  }

// ---------- tareas ----------
function renderTareasList(taskList){
  const cont = document.getElementById('tareas');
  if (!cont) return;
  if (!taskList || taskList.length === 0) {
    cont.innerHTML = '<div class="empty">No tasks assigned at the moment.</div>';
    return;
  }
  cont.innerHTML = taskList.map(t => {
    const hecha = t.estado === 'hecha';
    const taskId = t.id || 'task-' + Math.random().toString(36).slice(2, 7);
    return `<div class="card">
      <div class="row">
        <div class="grow">
          <h3>${esc(t.titulo)}</h3>
          <div class="row" style="gap:6px">
            <span class="tag">${esc(TIPO_LBL[t.tipo]||t.tipo)}</span>
            ${t.nivel?`<span class="tag lvl">${esc(t.nivel)}</span>`:''}
            ${t.area?`<span class="tag">${esc(t.area)}</span>`:''}
            <span class="tag ${hecha?'ok':'pend'}">${hecha?'✓ Completed':'⏳ Pending'}</span>
          </div>
          <p class="muted" style="margin-top:6px">Assigned: ${fmtFecha(t.fecha)}</p>
        </div>
        <div class="row" style="gap:8px">
          ${t.tipo==='practica'&&t.temaId
            ?`<a class="btn red" href="ejercicio.html?t=${encodeURIComponent(token)}&tema=${encodeURIComponent(t.temaId)}&tarea=${taskId}">Do Exercise →</a>`
            :(() => {
                let mUrl = t.url || '#';
                if (mUrl && mUrl !== '#' && !mUrl.includes('t=')) {
                  mUrl += (mUrl.includes('?') ? '&' : '?') + `t=${encodeURIComponent(token)}&tarea=${encodeURIComponent(taskId)}`;
                }
                return `<a class="btn sec" target="_blank" rel="noopener" href="${esc(mUrl)}">Open Mission ↗</a>`;
              })()}
          ${hecha||(t.tipo==='practica'&&t.temaId)?'':`<button class="red" onclick="abrirModal('${taskId}')">Record Result</button>`}
        </div>
      </div>
    </div>`;
  }).join('');
  window._tareas = Object.fromEntries(taskList.map(d => [d.id, d]));
}

async function cargarTareas(){
  const cont = document.getElementById('tareas');
  if (!cont) return;
  if (FALLBACK_TAREAS[token]) {
    renderTareasList(FALLBACK_TAREAS[token]);
  }

  let taskList = [];
  const fbKey = 'AIzaSyB3-Zld9m5cskqIj1h3Dmf4qfy52rVtEqM';
  try{
    const timeoutPromise = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 2500));
    const q = await Promise.race([ref().collection('tareas').orderBy('fecha','desc').get(), timeoutPromise]);
    if(!q.empty) {
      taskList = q.docs.map(d => Object.assign({ id: d.id }, d.data()));
    }
  }catch(e){
    // REST API fallback
    try {
      const res = await fetch(`https://firestore.googleapis.com/v1/projects/sanguine-fusion-403621/databases/(default)/documents/estudiantes/${encodeURIComponent(token)}/tareas?key=${fbKey}`);
      if (res.ok) {
        const data = await res.json();
        if (data.documents) {
          taskList = data.documents.map(d => {
            const f = d.fields || {};
            return {
              id: d.name.split('/').pop(),
              titulo: f.titulo?.stringValue || 'Task',
              tipo: f.tipo?.stringValue || 'practica',
              nivel: f.nivel?.stringValue || 'A1',
              area: f.area?.stringValue || '',
              estado: f.estado?.stringValue || 'pendiente',
              fecha: f.fecha?.timestampValue || d.createTime,
              url: f.url?.stringValue || '#',
              temaId: f.temaId?.stringValue || ''
            };
          });
        }
      }
    } catch(restErr){}
  }

  if (taskList.length > 0) {
    // Merge with fallback tasks
    const map = new Map();
    (FALLBACK_TAREAS[token] || []).forEach(t => map.set(t.id, t));
    taskList.forEach(t => map.set(t.id, Object.assign({}, map.get(t.id) || {}, t)));
    renderTareasList(Array.from(map.values()));
  } else if (!FALLBACK_TAREAS[token]) {
    cont.innerHTML = '<div class="empty">No tasks assigned at the moment.</div>';
  }
}

// ---------- modal registrar ----------
function abrirModal(tareaId){
  const t = window._tareas[tareaId];
  modalCtx = { tareaId, temaId:t.temaId||'', tema:t.titulo, area:t.area||'', nivel:t.nivel||EST.nivel, tipo:t.tipo||'practica' };
  document.getElementById('mTema').textContent = t.titulo;
  document.getElementById('mScore').value = ''; document.getElementById('mNota').value = '';
  document.getElementById('modalBg').classList.remove('hidden');
}
function registrarLibre(){
  const id = document.getElementById('libreTema').value;
  const t = temaPorId(id);
  if(!t) return toast('Please select a topic first');
  modalCtx = { tareaId:null, temaId:t.id, tema:t.tema, area:t.area, nivel:t.nivel, tipo:'practica' };
  document.getElementById('mTema').textContent = t.tema;
  document.getElementById('mScore').value = ''; document.getElementById('mNota').value = '';
  document.getElementById('modalBg').classList.remove('hidden');
}
function cerrarModal(){ document.getElementById('modalBg').classList.add('hidden'); }
async function guardarResultado(){
  const score = Number(document.getElementById('mScore').value);
  if(isNaN(score) || score < 0 || score > 100 || document.getElementById('mScore').value === '')
    return toast('Please enter a score between 0 and 100');
  const btn = document.getElementById('mGuardar'); btn.disabled = true;
  try{
    await ref().collection('resultados').add({
      temaId: modalCtx.temaId, tema: modalCtx.tema, area: modalCtx.area,
      nivel: modalCtx.nivel, tipo: modalCtx.tareaId ? 'tarea' : 'libre',
      tareaId: modalCtx.tareaId, score,
      comentario: document.getElementById('mNota').value.trim(),
      fecha: FV.serverTimestamp()
    });
    if(modalCtx.tareaId) await ref().collection('tareas').doc(modalCtx.tareaId).update({estado:'hecha'});
    cerrarModal(); toast('Result saved successfully! 🎉');
    cargarTareas(); cargarHistorial();
  }catch(e){ console.error(e); toast('Could not save, please check connection'); }
  btn.disabled = false;
}

function poblarNivelesLibres(){
  const sel = document.getElementById('libreNivel');
  const niveles = [...new Set(CATALOGO.map(t => t.nivel))];
  const idx = niveles.indexOf(EST.nivel);
  sel.innerHTML = niveles.map(n => `<option ${n===EST.nivel?'selected':''}>${n}</option>`).join('');
  if(idx === -1 && niveles.length) sel.value = niveles[0];
  poblarTemasLibres();
}
function poblarTemasLibres(){
  const n = document.getElementById('libreNivel').value;
  document.getElementById('libreTema').innerHTML =
    CATALOGO.filter(t => t.nivel === n).map(t => `<option value="${esc(t.id)}">${esc(t.tema)}</option>`).join('');
}
function abrirLibre(){
  const id = document.getElementById('libreTema').value;
  if(id) location.href = 'ejercicio.html?t=' + encodeURIComponent(token) + '&tema=' + encodeURIComponent(id);
}

function renderHistorialTable(items){
  const cont = document.getElementById('historial');
  if (!cont) return;
  if (!items || items.length === 0) {
    cont.innerHTML = '<div class="empty">No results recorded yet. Your first score awaits!</div>';
    return;
  }
  cont.innerHTML = '<div class="card" style="padding:6px 10px;overflow-x:auto"><table><thead><tr><th>Date</th><th>Topic</th><th>Type</th><th>Score</th></tr></thead><tbody>' +
    items.map(r => `<tr>
      <td class="mono">${fmtFecha(r.fecha)}</td>
      <td>${esc(r.tema || r.temaId || 'Topic')}</td>
      <td><span class="tag">${esc(r.tipo || 'exercise')}</span></td>
      <td><span class="score ${scoreClass(Number(r.score)||0)}">${r.score}%</span></td>
    </tr>`).join('') + '</tbody></table></div>';
}

async function cargarHistorial(){
  const cont = document.getElementById('historial');
  if (!cont) return;
  if (FALLBACK_HISTORIAL[token]) {
    renderHistorialTable(FALLBACK_HISTORIAL[token]);
  }

  let items = [];
  const fbKey = 'AIzaSyB3-Zld9m5cskqIj1h3Dmf4qfy52rVtEqM';
  try{
    const timeoutPromise = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 2500));
    const q = await Promise.race([ref().collection('resultados').orderBy('fecha','desc').limit(40).get(), timeoutPromise]);
    if(!q.empty) {
      items = q.docs.map(d => d.data());
    }
  }catch(e){
    // REST API fallback
    try {
      const res = await fetch(`https://firestore.googleapis.com/v1/projects/sanguine-fusion-403621/databases/(default)/documents/estudiantes/${encodeURIComponent(token)}/resultados?key=${fbKey}`);
      if (res.ok) {
        const data = await res.json();
        if (data.documents) {
          items = data.documents.map(d => {
            const f = d.fields || {};
            return {
              tema: f.tema?.stringValue || f.temaId?.stringValue || 'Topic',
              temaId: f.temaId?.stringValue || '',
              tipo: f.tipo?.stringValue || 'exercise',
              score: Number(f.score?.integerValue || f.score?.stringValue || 0),
              fecha: f.fecha?.timestampValue || d.createTime,
              comentario: f.comentario?.stringValue || ''
            };
          });
        }
      }
    } catch(restErr){}
  }

  if (items.length > 0) {
    // Union with fallback results by topic/date
    const existing = new Set(items.map(i => (i.temaId || i.tema) + String(i.score)));
    (FALLBACK_HISTORIAL[token] || []).forEach(f => {
      const k = (f.temaId || f.tema) + String(f.score);
      if (!existing.has(k)) items.push(f);
    });
    renderHistorialTable(items);
  } else if (!FALLBACK_HISTORIAL[token]) {
    cont.innerHTML = '<div class="empty">No results recorded yet. Your first score awaits!</div>';
  }
}

// ---------- comentarios ----------
async function cargarComentarios(){
  const cont = document.getElementById('comentarios');
  let items = [];
  try{
    const q = await ref().collection('comentarios').orderBy('fecha','desc').limit(30).get();
    if(!q.empty) {
      items = q.docs.map(d => d.data());
    }
  }catch(e){
    console.warn('cargarComentarios deferred:', e);
  }

  if(items.length === 0){
    cont.innerHTML = '<div class="empty">No messages yet. Send a note below!</div>';
    return;
  }
  cont.innerHTML = items.map(c => `
    <div class="comment ${c.autor==='profesor'?'prof':''}">
      <div class="who">${c.autor==='profesor'?esc(TEACHER_NAME || 'Prof. Felipe Florez')+' (Instructor)':'You'} · ${fmtFecha(c.fecha)}</div>
      <div>${esc(c.texto)}</div>
    </div>`).join('');
}
async function enviarComentario(){
  const ta = document.getElementById('nuevoComentario');
  const texto = ta.value.trim();
  if(!texto) return;
  try{
    await ref().collection('comentarios').add({texto, autor:'estudiante', fecha: FV.serverTimestamp()});
    ta.value = ''; toast('Note sent'); cargarComentarios();
  }catch(e){ toast('Could not send note'); }
}

// ---------- control de horas y confirmación de clase ----------
function renderHorasCardBody(){
  if(!EST) return '<div class="empty">Loading hours balance…</div>';

  const tot = Number(EST.horas_contratadas) || 0;
  const clases = Array.isArray(EST.clases) ? EST.clases : [];
  const horasMap = EST.clases_horas || {};

  let given = 0;
  for (const c of clases) {
    const h = Number(horasMap[c]);
    given += (h && !isNaN(h) && h > 0) ? h : 1.0;
  }
  if (given === 0 && Number(EST.horas_dadas) > 0) {
    given = Number(EST.horas_dadas);
  }
  given = Math.round(given * 10) / 10;

  let rem;
  if (clases.length === 0 && Number(EST.horas_restantes) !== undefined && !isNaN(Number(EST.horas_restantes))) {
    rem = Number(EST.horas_restantes);
  } else {
    rem = Math.max(0, Math.round((tot - given) * 10) / 10);
  }
  const pct = tot > 0 ? Math.min(100, Math.round((given / tot) * 100)) : 0;

  const remColor = rem <= 0 ? 'var(--red)' : rem <= 5 ? 'var(--gold)' : '#2E7D4F';
  const barColor = rem <= 0 ? 'var(--red)' : rem <= 5 ? 'var(--gold)' : '#2E7D4F';

  const _now = new Date();
  const _yr = _now.getFullYear();
  const _mo = String(_now.getMonth() + 1).padStart(2, '0');
  const _da = String(_now.getDate()).padStart(2, '0');
  const todayStr = `${_yr}-${_mo}-${_da}`;
  const todaySessions = clases.filter(c => c.split('#')[0] === todayStr);
  const isTodayConfirmed = todaySessions.length > 0;
  let todayHours = 0;
  for (const k of todaySessions) {
    const h = Number(horasMap[k]);
    todayHours += (h && !isNaN(h) && h > 0) ? h : 1.0;
  }
  const ackMap = EST.confirmaciones_estudiante || {};
  const isAcked = !!ackMap[todayStr];

  let todayBanner = '';
  if (isTodayConfirmed) {
    todayBanner = `
      <div style="background:rgba(46,125,79,0.09); border:1.5px solid #2E7D4F; border-radius:8px; padding:12px 14px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <div>
          <div style="font-weight:700; color:#2E7D4F; display:flex; align-items:center; gap:6px;">
            <span>✓</span> Today's Class Confirmed by Instructor (${todayStr})
          </div>
          <div style="font-size:13px; color:var(--muted); margin-top:3px;">
            ${todayHours.toFixed(1)} hour(s) successfully completed and logged in your attendance record (${todaySessions.length} session${todaySessions.length > 1 ? 's' : ''}).
          </div>
        </div>
        <div>
          ${isAcked ? `
            <span class="tag ok" style="padding:6px 12px; font-size:12px; font-weight:600;">✓ Verified by You</span>
          ` : `
            <button onclick="confirmarClaseEstudiante('${todayStr}')" style="background:#2E7D4F; color:#fff; font-size:13px; padding:8px 14px; cursor:pointer;">
              ✓ Confirm Receipt of Class
            </button>
          `}
        </div>
      </div>
    `;
  } else {
    todayBanner = `
      <div style="background:var(--paper); border:1px dashed var(--line); border-radius:8px; padding:10px 14px; margin-bottom:14px; font-size:13px; color:var(--muted); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;">
        <span>📅 No class logged yet today (${todayStr}).</span>
        <span style="font-size:12px; font-family:var(--mono);">Next session will appear here once conducted.</span>
      </div>
    `;
  }

  const sortedClases = [...clases].sort().reverse();
  let listHtml = '';
  if (sortedClases.length > 0) {
    const notas = EST.clases_notas || {};
    listHtml = `
      <div style="margin-top:16px;">
        <div style="font-family:var(--mono); font-size:11px; text-transform:uppercase; color:var(--muted); margin-bottom:8px; letter-spacing:0.06em; font-weight:700;">
          📋 Attendance Log & Completed Sessions (${sortedClases.length})
        </div>
        <div style="overflow-x:auto; border:1px solid var(--line); border-radius:8px;">
          <table style="width:100%; border-collapse:collapse; font-size:13px;">
            <thead>
              <tr style="background:var(--paper); border-bottom:1px solid var(--line);">
                <th style="padding:7px 10px; text-align:center; width:40px;">#</th>
                <th style="padding:7px 10px; text-align:left; width:150px;">Date</th>
                <th style="padding:7px 10px; text-align:left;">Topic / Focus</th>
                <th style="padding:7px 10px; text-align:center; width:80px;">Hours</th>
                <th style="padding:7px 10px; text-align:center; width:100px;">Status</th>
              </tr>
            </thead>
            <tbody>
              ${sortedClases.map((iso, idx) => {
                const num = sortedClases.length - idx;
                const baseDate = iso.split('#')[0];
                const sessionPart = iso.includes('#') ? ` (Session #${iso.split('#')[1]})` : '';
                let dateLabel = baseDate;
                try {
                  const parts = baseDate.split('-');
                  const dObj = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
                  dateLabel = dObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
                } catch(e){}
                const topic = notas[iso] || '1-on-1 Personalized Class Session';
                const dur = Number(horasMap[iso]) || 1.0;
                return `
                  <tr style="border-bottom:1px solid var(--line);">
                    <td style="padding:8px 10px; text-align:center; font-family:var(--mono); font-weight:700; color:var(--gold);">#${num}</td>
                    <td style="padding:8px 10px; font-family:var(--mono); font-weight:600;">${dateLabel}${sessionPart ? `<span style="font-size:10px; color:var(--muted); display:block;">${sessionPart}</span>` : ''}</td>
                    <td style="padding:8px 10px; color:var(--ink);">${esc(topic)}</td>
                    <td style="padding:8px 10px; text-align:center; font-family:var(--mono); color:#2E7D4F; font-weight:700;">${dur.toFixed(1)}h</td>
                    <td style="padding:8px 10px; text-align:center;"><span class="tag ok">✓ Conducted</span></td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  return `
    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:12px; margin-bottom:14px;">
      <div style="background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:12px; text-align:center;">
        <div style="font-family:var(--serif); font-size:26px; font-weight:700; color:var(--ink);">${tot}h</div>
        <div style="font-family:var(--mono); font-size:11px; text-transform:uppercase; color:var(--muted); margin-top:2px;">Contracted Package</div>
      </div>
      <div style="background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:12px; text-align:center;">
        <div style="font-family:var(--serif); font-size:26px; font-weight:700; color:var(--gold);">${given.toFixed(1)}h</div>
        <div style="font-family:var(--mono); font-size:11px; text-transform:uppercase; color:var(--muted); margin-top:2px;">Hours Conducted (${clases.length} sessions)</div>
      </div>
      <div style="background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:12px; text-align:center;">
        <div style="font-family:var(--serif); font-size:26px; font-weight:700; color:${remColor};">${rem.toFixed(1)}h</div>
        <div style="font-family:var(--mono); font-size:11px; text-transform:uppercase; color:var(--muted); margin-top:2px;">Remaining Balance</div>
      </div>
    </div>

    <div style="margin-bottom:14px;">
      <div style="display:flex; justify-content:space-between; font-family:var(--mono); font-size:12px; color:var(--muted); margin-bottom:5px;">
        <span>Package Progress: <b>${pct}%</b></span>
        <span><b>${rem.toFixed(1)}h</b> remaining</span>
      </div>
      <div style="background:var(--line); height:9px; border-radius:5px; overflow:hidden;">
        <div style="background:${barColor}; width:${pct}%; height:100%; transition:width 0.5s ease;"></div>
      </div>
    </div>

    ${todayBanner}
    ${listHtml}
  `;
}

async function confirmarClaseEstudiante(dateStr){
  if(!dateStr) return;
  try{
    const ackMap = Object.assign({}, EST.confirmaciones_estudiante || {});
    ackMap[dateStr] = new Date().toISOString();
    await ref().set({ confirmaciones_estudiante: ackMap }, { merge: true });
    EST.confirmaciones_estudiante = ackMap;
    toast('✨ Class confirmed! Thank you for learning with us today.');
    const cont = document.getElementById('horasContenedor');
    if (cont) cont.innerHTML = renderHorasCardBody();
  }catch(e){
    console.error('Error confirming class:', e);
    toast('Could not save confirmation. Please check connection.');
  }
}

init();
</script>
</body>
</html>
